<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriScale OS — V12 Command Center</title>
<style>
:root{--navy:#102B3F;--teal:#057C81;--pale:#F2F7F9;--amber:#B7791F;--red:#B3261E;--green:#137333;--ink:#1c2b33}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Roboto,sans-serif;background:var(--pale);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0}header .sub{opacity:.75;font-size:12px}
#killBtn{margin-left:auto;border:0;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;background:#e8f5e9;color:var(--green)}
#killBtn.on{background:var(--red);color:#fff}
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:225px;background:#fff;border-right:1px solid #dde7ec;padding:10px;flex-shrink:0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
nav button:hover{background:var(--pale)}nav button.active{background:var(--teal);color:#fff;font-weight:600}
main{flex:1;padding:18px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(16,43,63,.08)}
.card .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.card .k{font-size:12px;color:#5b7181}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #edf2f5;text-align:left;font-size:13px}th{background:#eef4f7}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.b-ok{background:#e6f4ea;color:var(--green)}.b-warn{background:#fef7e0;color:var(--amber)}.b-bad{background:#fce8e6;color:var(--red)}.b-info{background:#e8f0fe;color:#1a56db}
.evidence{font-size:11.5px;color:#5b7181;margin-top:8px}
.empty{background:#fff;border:1.5px dashed #b9cdd6;border-radius:12px;padding:26px;text-align:center;color:#47606e}
input,select,textarea{padding:8px;border:1px solid #c3d2da;border-radius:8px;font-size:13px}
.btn{background:var(--teal);color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.sec{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
form.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
h2{font-size:19px;margin:4px 0 10px}h3{font-size:15px;margin:16px 0 6px}
#login{position:fixed;inset:0;background:var(--navy);display:none;align-items:center;justify-content:center;z-index:9}
#login .box{background:#fff;padding:26px;border-radius:14px;width:320px}
#login input{width:100%;margin:6px 0}
.err{color:var(--red);font-size:12.5px;min-height:16px}
@media(max-width:820px){nav{width:64px}nav button span{display:none}}
</style></head>
<body>
<div id="login"><div class="box">
<h2 style="margin-top:0">🌰 NutriScale OS</h2><p style="color:#5b7181;font-size:13px">Dry Fruit Farm — pehle pehchan, phir data. Bina login ke kuch nahi dikhega (V12 niyam).</p>
<input id="lu" placeholder="Username"><input id="lp" type="password" placeholder="Password">
<input id="lt" placeholder="MFA code (sirf MFA wale khaate par)" style="display:none">
<div class="err" id="lerr"></div><button class="btn" style="width:100%" onclick="doLogin()">Login</button>
</div></div>
<header><h1>🌰 NutriScale OS</h1><span class="sub">V12 · Dry Fruit Farm · saara data API se live, saboot ke saath</span>
<span id="who" class="sub"></span>
<button id="killBtn" onclick="toggleKill()">Kill Switch: …</button></header>
<div class="wrap"><nav id="sidenav"></nav><main id="main"><p>Load ho raha hai…</p></main></div>
<script>
const API=location.protocol.startsWith('http')?location.origin:'http://'+location.hostname+':8765';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let TOKEN=localStorage.getItem('ns_token')||'', USER=null, KILL=false;
const SCREENS=[['warroom','🏠 War Room'],['products','📦 Product Intelligence'],['competitors','🔭 Competitor Observatory'],['compare','⚖️ Peer Compare'],['keywords','🔑 Keyword Lab'],['rank','📈 Rank Tracker'],['ads','🎯 Ads Studio'],['listings','📝 Listing Lab'],['creative','🎨 Creative Lab'],['experiments','🧪 Experiments'],['profit','💰 Profit & Settlements'],['inventory','🏭 Inventory & Festival'],['approvals','✅ Approval Inbox'],['integrations','🔌 Integrations'],['agency','🤝 Agency Board'],['ops','🛠️ System Ops']];
async function api(path,method,body){
  const r=await fetch(API+path,{method:method||'GET',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){showLogin();throw new Error('login chahiye');}
  const j=await r.json(); return j.data!==undefined?j.data:j;
}
function showLogin(){document.getElementById('login').style.display='flex';}
async function doLogin(){
  const u=document.getElementById('lu').value,p=document.getElementById('lp').value,t=document.getElementById('lt').value;
  const r=await fetch(API+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,totp:t||undefined})});
  const j=await r.json();
  if(!r.ok){
    if(j.error==='MFA_REQUIRED'){document.getElementById('lt').style.display='block';document.getElementById('lerr').textContent='MFA code daalo (authenticator app se) aur phir Login dabao';}
    else document.getElementById('lerr').textContent='Login fail — username/password parkho';
    return;}
  TOKEN=j.data.token; localStorage.setItem('ns_token',TOKEN); USER=j.data;
  document.getElementById('login').style.display='none'; boot();
}
const inr=n=>n===null||n===undefined?'—':'₹'+Number(n).toLocaleString('en-IN');
const badge=(t,c)=>'<span class="badge b-'+c+'">'+t+'</span>';
const ev=(src)=>'<div class="evidence">Source: '+src+' · '+new Date().toLocaleString('en-IN')+'</div>';
function table(cols,rows,emptyMsg){
  if(!rows||!rows.length) return '<div class="empty">'+(emptyMsg||'Abhi data nahi hai — pehle import/sync karo. Jhootha number yahan kabhi nahi dikhega.')+'</div>';
  let h='<table><tr>'+cols.map(c=>'<th class="'+(c.n?'num':'')+'">'+c.t+'</th>').join('')+'</tr>';
  for(const r of rows) h+='<tr>'+cols.map(c=>'<td class="'+(c.n?'num':'')+'">'+(c.f?c.f(r):esc(r[c.k]??'—'))+'</td>').join('')+'</tr>';
  return h+'</table>';
}
function cards(items){return '<div class="cards">'+items.map(i=>'<div class="card"><div class="k">'+i[0]+'</div><div class="v">'+i[1]+'</div><div class="k">'+(i[2]||'')+'</div></div>').join('')+'</div>';}
async function refreshKill(){
  try{const k=await api('/api/v1/control/kill');KILL=k.engaged;
    const b=document.getElementById('killBtn');b.textContent=KILL?'🛑 KILL SWITCH ON — saare writes band':'Kill Switch: OFF';b.className=KILL?'on':'';
  }catch(e){}
}
async function toggleKill(){
  const reason=KILL?'':prompt('Kill switch ON karne ki wajah?');
  if(!KILL&&reason===null)return;
  try{await api('/api/v1/control/kill','POST',{engaged:!KILL,reason:reason||''});refreshKill();}catch(e){alert('Sirf Owner kill switch chala sakta hai');}
}
const VIEWS={
async warroom(m){
  const w=await api('/api/warroom'); const h=await api('/api/v1/system/health');
  if(!w.connected){m.innerHTML='<h2>War Room</h2><div class="empty">Database me abhi asal data nahi hai.<br>Integrations screen se CSV import karo ya API keys jodo — tab yahan asal numbers aayenge.</div>'+ev('warroom service');return;}
  const k=w.kpis||{};
  m.innerHTML='<h2>War Room — aaj ki tasveer</h2>'+cards([['Revenue',inr(k.revenue),'orders: '+(k.orders??'—')],['Ad Spend',inr(k.ad_spend),''],['Blended ROAS',k.blended_roas??'—',''],['TACOS',k.tacos_pct?k.tacos_pct+'%':'—','matched period par hi']])+
  (h.alerts&&h.alerts.length?'<h3>⚠️ Alerts</h3>'+h.alerts.map(a=>'<p>'+badge('ALERT','warn')+' '+a+'</p>').join(''):'<p>'+badge('Sab theek','ok')+'</p>')+ev('apne imported data se — OBSERVED');
},
async products(m){
  const plan=await api('/api/action-plan'); const costs=await api('/api/v1/costs');
  const p=plan.plan||{};
  m.innerHTML='<h2>Product Intelligence</h2>'+cards([['Pause list', (p.pause||[]).length+' campaigns','zero-sale'],['Scale list',(p.scale||[]).length+' campaigns',''],['Andazan bachat',inr(p.savings_est),'/cycle']])+
  '<h3>SKU Costs (versioned)</h3>'+table([{t:'SKU',k:'sku'},{t:'COGS',k:'cogs',n:1},{t:'Packing',k:'packaging',n:1},{t:'Laagu',k:'effective_from'}],costs.costs,'Cost darj nahi — bina cost ke scale ki sifarish band hai (FIN-01)')+ev('action planner + cost registry');
},
async competitors(m){
  const d=await api('/api/v1/competitors');
  m.innerHTML='<h2>Competitor Observatory</h2>'+table([{t:'Peer',k:'title'},{t:'Grade',k:'grade'},{t:'Pack (g)',k:'pack_g',n:1},{t:'Taaza Price',f:r=>r.latest_snapshot?inr(r.latest_snapshot.price):'unknown'},{t:'Rating',f:r=>r.latest_snapshot?(r.latest_snapshot.rating??'—'):'—'},{t:'Snapshot',f:r=>r.latest_snapshot?r.latest_snapshot.captured_at:'nahi mila'}],d.peers,'Abhi koi peer darj nahi — neeche se verified peer jodo')+
  '<h3>Naya peer jodo</h3><form class="row" onsubmit="return addPeer(event)"><input name="title" placeholder="Peer ka title" required><input name="peer_ref" placeholder="ASIN/FSN"><input name="nut_type" placeholder="cashew/almond"><input name="grade" placeholder="W320"><input name="pack_g" type="number" placeholder="200"><button class="btn">Jodo</button></form>'+
  '<h3>Snapshot darj karo (dated observation)</h3><form class="row" onsubmit="return addSnap(event)"><input name="peer_id" type="number" placeholder="Peer ID" required><input name="price" type="number" step="0.01" placeholder="Price ₹"><input name="rating" type="number" step="0.1" placeholder="Rating"><input name="reviews" type="number" placeholder="Reviews"><input name="image_count" type="number" placeholder="Images"><button class="btn">Darj karo</button></form>'+ev('manual verified observation — CMP-01/02');
},
async compare(m){
  m.innerHTML='<h2>Peer Compare — Decision Packet</h2><form class="row" onsubmit="return loadPacket(event)"><input name="sku" placeholder="Apna SKU (catalog wala)" required><input name="peer" type="number" placeholder="Peer ID" required><input name="nut" placeholder="cashew"><input name="grade" placeholder="W320"><input name="pack_g" type="number" placeholder="200"><button class="btn">Packet banao</button></form><div id="packet"></div>'+ev('CMP decision packet — saboot, farq, margin guardrail, tajurba');
},
async keywords(m){
  const d=await api('/api/v1/keywords/matrix');
  m.innerHTML='<h2>Keyword Lab</h2>'+table([{t:'Term',k:'term'},{t:'Clicks',k:'clicks',n:1},{t:'Orders',k:'orders',n:1},{t:'CVR %',k:'cvr_pct',n:1},{t:'ROAS',k:'roas',n:1},{t:'Search Volume',f:r=>r.search_volume===null?badge('unknown','warn'):r.search_volume},{t:'Score',k:'opportunity_score',n:1}],d.matrix)+ev('apne search-term report se OBSERVED; volume licensed provider bina UNKNOWN (KWD-01)');
},
async rank(m){
  m.innerHTML='<h2>Rank Tracker</h2><form class="row" onsubmit="return loadRank(event)"><input name="term" placeholder="brazil nuts" required><input name="sku" placeholder="SKU" required><button class="btn">Trend dekho</button></form><div id="rankout"></div>'+ev('rank observations — kam se kam 3 points bina natija nahi (RNK-01)');
},
async ads(m){
  const d=await api('/api/v1/ads/health');
  const mx=Math.max(...(d.campaigns||[]).map(c=>c.spend||0),1);
  const bars=(d.campaigns||[]).slice(0,8).map(c=>'<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="min-width:150px;font-size:12px">'+esc(c.name)+'</span><div style="height:14px;background:#057C81;border-radius:4px;width:'+Math.max(2,(c.spend/mx*55)).toFixed(1)+'%"></div><span style="font-size:12px">'+inr(c.spend)+'</span></div>').join('');
  m.innerHTML='<h2>Ads Studio</h2><div class="card"><div class="k">Kharch ka bantwara (upar wale 8 campaigns)</div>'+bars+'</div>'+table([{t:'Campaign',k:'name'},{t:'Spend',n:1,f:r=>inr(r.spend)},{t:'Sales',n:1,f:r=>inr(r.sales)},{t:'ROAS',k:'roas',n:1},{t:'ACOS %',k:'acos_pct',n:1}],d.campaigns)+
  '<h3>Harvest candidates</h3>'+table([{t:'Term',k:'term'},{t:'Campaign',k:'from_campaign'},{t:'Orders',k:'orders',n:1}],(d.harvest||{}).harvest,'—')+
  '<h3>Negative candidates</h3>'+table([{t:'Term',k:'term'},{t:'Campaign',k:'campaign'},{t:'Barbaad',n:1,f:r=>inr(r.wasted)}],(d.harvest||{}).negatives,'—')+ev('ADS-01..05 — sifarishen proposals se lagu hongi, seedha kabhi nahi');
},
async listings(m){
  const d=await api('/api/v1/listings/versions');
  m.innerHTML='<h2>Listing Lab — Versions</h2>'+table([{t:'SKU',k:'sku'},{t:'Ver',k:'version',n:1},{t:'Title',k:'title'},{t:'Status',f:r=>badge(r.status,r.status==='APPROVED'?'ok':'info')},{t:'Banaya',k:'created_by'}],d.versions,'Abhi koi draft nahi')+
  '<h3>Naya draft</h3><form class="row" onsubmit="return addDraft(event)"><input name="sku" placeholder="SKU" required><input name="title" placeholder="Naya title" size="50" required><button class="btn">Draft banao</button></form><p style="font-size:12.5px;color:#5b7181">Approve karte samay har dawa fact-registry se parkha jayega — saboot na ho to NEEDS_EVIDENCE (POL-01).</p>'+ev('listing versions — itihaas kabhi mit-ta nahi');
},
async creative(m){
  m.innerHTML='<h2>Creative Lab — Image Brief</h2><form class="row" onsubmit="return loadBrief(event)"><input name="product" placeholder="Brazil Nuts" required><input name="grade" placeholder="Grade A++"><input name="weight" placeholder="200g"><button class="btn">Brief banao</button></form><div id="brief"></div>'+ev('7-shot brief — CVR-01/LST-03');
},
async experiments(m){
  const d=await api('/api/v1/experiments');
  m.innerHTML='<h2>Experiment Center</h2>'+table([{t:'Naam',k:'name'},{t:'SKU',k:'sku'},{t:'Parikalpana',k:'hypothesis'},{t:'Status',k:'status'},{t:'Verdict',f:r=>r.verdict?badge(r.verdict,r.verdict==='WIN'?'ok':r.verdict==='LOSS'?'bad':'warn'):'—'}],d.experiments,'Abhi koi tajurba nahi — pehla tajurba Cashew W320 par (UC-01)')+ev('kam sample = INCONCLUSIVE, jeet ka jhootha elaan kabhi nahi');
},
async profit(m){
  const rec=await api('/api/v1/finance/reconciliation');
  m.innerHTML='<h2>Profit & Settlements</h2>'+cards([['Order GMV',inr(rec.order_gmv),rec.order_lines+' lines'],['Settlement Net',inr(rec.settlement_net_payout),''],['Farq',inr(rec.difference),rec.status]]) +
  '<p>'+(rec.status==='MATCHED'?badge('MATCHED','ok'):badge('EXCEPTION','warn'))+' '+rec.note+'</p>'+
  '<h3>Cost darj karo</h3><form class="row" onsubmit="return addCost(event)"><input name="sku" placeholder="SKU" required><input name="cogs" type="number" step="0.01" placeholder="COGS ₹" required><input name="packaging" type="number" step="0.01" placeholder="Packing ₹"><button class="btn">Darj karo</button></form>'+ev('FIN-01/02 — settlement se mila hua hisaab hi sach');
},
async inventory(m){
  const sp=await api('/api/season-pack');
  m.innerHTML='<h2>Inventory & Festival</h2><form class="row" onsubmit="return loadGate(event)"><input name="sku" placeholder="SKU ka stock gate" required><button class="btn">Parkho</button></form><div id="gate"></div>'+
  '<h3>Season Combos</h3>'+table([{t:'Combo',k:'name'},{t:'Gift Price',n:1,f:r=>inr(r.gift_price)},{t:'AOV x',k:'aov_multiple',n:1}],sp.combos||[],'Catalog khaali hai')+ev('INV-01 stock gate + CVR-04 festival lab');
},
async approvals(m){
  const pv=await api('/api/v1/proposals'); const legacy=await api('/api/approvals');
  m.innerHTML='<h2>Approval Inbox</h2><h3>V12 Proposals (state machine)</h3>'+table([{t:'ID',k:'id',n:1},{t:'Prakar',k:'kind'},{t:'Platform',k:'platform'},{t:'Tier',k:'tier'},{t:'State',f:r=>badge(r.state,'info')},{t:'Banaya',k:'created_by'},{t:'Action',f:r=>r.state==='APPROVAL_PENDING'?'<button class="btn" onclick="propAct('+r.id+',\'approve\')">Approve</button>':r.state==='APPROVED'?'<button class="btn" onclick="propAct('+r.id+',\'queue\')">Queue</button>':r.state==='QUEUED'?'<button class="btn" onclick="propExec('+r.id+')">Execute (saboot ke saath)</button>':''}],pv.proposals,'Koi proposal nahi')+
  '<h3>Agent Proposals (purani kataar)</h3>'+table([{t:'ID',k:'id',n:1},{t:'Agent',k:'agent'},{t:'Prakar',k:'action_type'},{t:'Vivaran',k:'description'},{t:'Tier',k:'tier'},{t:'Status',k:'status'},{t:'Action',f:r=>'<button class="btn" onclick="legacyAct('+r.id+',\'approve\')">Approve</button> <button class="btn sec" onclick="legacyAct('+r.id+',\'reject\')">Reject</button>'}],legacy.approvals,'Koi intezaar wala proposal nahi')+ev('SEC-03 — APPLIED_VERIFIED sirf pushti par');
},
async integrations(m){
  const cs=await api('/api/connectors/status'); const caps=await api('/api/v1/capabilities');
  const connRows=Object.entries(cs.connectors).map(([k,v])=>({name:k,...v}));
  m.innerHTML='<h2>Integrations & Data Quality</h2><h3>Connectors</h3>'+table([{t:'Connector',k:'name'},{t:'Halat',f:r=>r.configured?badge('CONFIGURED','ok'):badge('baki: '+(r.missing||[]).join(','),'warn')}],connRows)+
  '<h3>Capabilities (jo certified nahi, woh band)</h3>'+table([{t:'Platform',k:'platform'},{t:'Capability',k:'capability'},{t:'Status',f:r=>badge(r.status,r.status==='unavailable'?'bad':r.status==='report_only'?'warn':'info')},{t:'Wajah',k:'reason'}],caps.capabilities)+
  '<h3>CSV Wizard — pehle preview</h3><form class="row" onsubmit="return wizPreview(event)"><input name="path" placeholder="Server par file ka path" size="46" required><button class="btn sec">Preview</button></form><form class="row" onsubmit="return wizCommit(event)"><button class="btn">Preview ke baad Commit</button></form><div id="wiz"></div>'+ev('INT-04 — duplicate file dobara import nahi hogi');
},
async agency(m){
  const a=await api('/api/v1/agency/scorecard');
  m.innerHTML='<h2>Agency Performance Board</h2>'+cards([['Kul Tasks',a.tasks_total,''],['Saboot ke saath Done',a.tasks_done_with_evidence,''],['Fees (kul)',inr(a.fees_total),''],['Vendor-Verified Badlav',a.vendor_verified_changes,'']])+'<p>'+a.note+'</p>'+ev('AGY-01 — dave par nahi, saboot par score');
},
async ops(m){
  const j=await api('/api/v1/jobs/status'); const h=await api('/api/v1/system/health');
  m.innerHTML='<h2>System Operations & Audit</h2>'+cards([['Kill Switch',h.kill_switch.engaged?'ON 🛑':'OFF',''],['Jobs Kul',h.jobs_total,''],['Aakhiri Import',h.last_import_at||'kabhi nahi','']])+
  '<h3>Jobs (durable, IST)</h3>'+table([{t:'Job',k:'job'},{t:'Agla Run',k:'next_run'},{t:'Aakhiri',k:'last_status'},{t:'Koshishen',k:'attempts',n:1}],j.jobs)+ev('JOB-01/OPS-01 — restart ke baad bhi state yaad');
}};
async function addPeer(e){e.preventDefault();const f=new FormData(e.target);await api('/api/v1/competitors/peers','POST',Object.fromEntries(f));show('competitors');return false;}
async function addSnap(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));for(const k of['peer_id','price','rating','reviews','image_count'])if(f[k])f[k]=Number(f[k]);await api('/api/v1/competitors/snapshots','POST',f);show('competitors');return false;}
async function loadPacket(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/competitors/packet?sku='+encodeURIComponent(f.sku)+'&peer='+f.peer+'&nut='+encodeURIComponent(f.nut)+'&grade='+encodeURIComponent(f.grade)+'&pack_g='+f.pack_g);document.getElementById('packet').innerHTML='<div class="card"><p><b>Match:</b> '+(d.match?d.match.class:'—')+'</p><p><b>Farq:</b> apna '+(d.gap?d.gap.own_per_100g:'—')+'/100g vs peer '+(d.gap?d.gap.peer_per_100g:'—')+'/100g ('+(d.gap?d.gap.gap_pct:'—')+'%)</p><p><b>Playbook:</b> '+(d.playbook||'')+'</p><p><b>Sifarish:</b> '+(d.recommended_action||d.note||'')+'</p><p class="evidence">'+(d.do_not_claim||'')+'</p></div>';return false;}
function sparkSVG(vals,invert){
  if(!vals||vals.length<2)return '';
  const w=560,h=90,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>((i/(vals.length-1))*w).toFixed(1)+','+(invert?((v-mn)/rg*(h-16)+8):(h-8-(v-mn)/rg*(h-16))).toFixed(1)).join(' ');
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="background:#fff;border-radius:10px;margin-top:8px"><polyline points="'+pts+'" fill="none" stroke="#057C81" stroke-width="2.5"/></svg>';
}
async function loadRank(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/rank?term='+encodeURIComponent(f.term)+'&sku='+encodeURIComponent(f.sku));const dg=await api('/api/v1/rank/diagnostic?term='+encodeURIComponent(f.term)+'&sku='+encodeURIComponent(f.sku));let g='';if(d.history&&d.history.length>1)g=sparkSVG(d.history.map(x=>x.position),true);
  let hy='';if(dg.hypotheses&&dg.hypotheses.length)hy='<h3>Rank parakh (parikalpana — siddh kaaran nahi)</h3>'+dg.hypotheses.map(x=>'<p>'+badge('HYPOTHESIS','warn')+' '+esc(x.hypothesis)+'<br><span class="evidence">Saboot: '+esc(x.evidence)+' · Kaam: '+esc(x.action)+'</span></p>').join('');
  document.getElementById('rankout').innerHTML='<div class="card"><b>'+esc(d.term)+'</b> — points: '+d.points+' · '+(d.status==='OK'?('taaza position '+d.latest+', badlav '+d.delta):esc(d.note))+'</div>'+g+hy;return false;}
async function addDraft(e){e.preventDefault();const f=new FormData(e.target);await api('/api/v1/listings/draft','POST',{sku:f.get('sku'),title:f.get('title'),bullets:[]});show('listings');return false;}
async function loadBrief(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/creative/brief?product='+encodeURIComponent(f.product)+'&grade='+encodeURIComponent(f.grade||'')+'&weight='+encodeURIComponent(f.weight||''));document.getElementById('brief').innerHTML=table([{t:'#',k:'shot'},{t:'Prakar',k:'type'},{t:'Brief',k:'brief'}],d.shots);return false;}
async function addCost(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));await api('/api/v1/costs','POST',{sku:f.sku,cogs:Number(f.cogs),packaging:Number(f.packaging||0)});show('profit');return false;}
async function loadGate(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/inventory/gate?sku='+encodeURIComponent(f.sku));document.getElementById('gate').innerHTML='<div class="card"><b>'+d.sku+'</b> — stock: '+d.qty+' · '+badge(d.status,d.status==='OK'?'ok':d.status==='LOW'?'warn':'bad')+' '+(d.note||'')+'</div>';return false;}
async function propAct(id,op){try{const r=await api('/api/v1/proposals/'+id+'/'+op,'POST',{});alert(r.state?(op==='approve'&&r.needed?'Pushti darj — '+(r.approvals||1)+'/'+r.needed:'State: '+r.state):(r.error||'ho gaya'));}catch(e){alert('Nahi ho paya: '+e.message);}show('approvals');}
async function propExec(id){const ref=prompt('Vendor console me badlav karke uska ref/saboot do (bina saboot ke APPLIED nahi likha jayega):');if(!ref)return;try{const r=await api('/api/v1/proposals/'+id+'/execute','POST',{manual_ref:ref});alert(r.state==='APPLIED_VERIFIED'?'✔ APPLIED_VERIFIED — saboot: '+ref:('Nahi hua: '+(r.error||r.state)));}catch(e){alert(e.message);}show('approvals');}
async function legacyAct(id,op){try{await api('/api/approvals/'+id+'/'+op,'POST',{});}catch(e){alert(e.message);}show('approvals');}
let WIZPATH='';
async function wizPreview(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));WIZPATH=f.path;const d=await api('/api/v1/imports/preview','POST',{path:f.path});document.getElementById('wiz').innerHTML='<div class="card">Prakar: <b>'+d.kind+'</b> · Rows: '+d.rows+' · Duplicate: '+(d.duplicate?'HAAN (commit rukega)':'nahi')+'<br><span class="evidence">'+d.note+'</span></div>';return false;}
async function wizCommit(e){e.preventDefault();if(!WIZPATH){alert('Pehle preview karo');return false;}const d=await api('/api/v1/imports/commit','POST',{path:WIZPATH});alert(d.duplicate?'Duplicate — import nahi hua':('Import ho gaya: '+(d.imported??0)+' rows'));return false;}
async function show(name){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===name));
  const m=document.getElementById('main');m.innerHTML='<p>Load ho raha hai…</p>';
  try{await VIEWS[name](m);}catch(e){m.innerHTML='<div class="empty">Data laane me dikkat: '+e.message+'<br>Backend chal raha hai na? (python3 backend/app.py)</div>';}}
function boot(){
  const nav=document.getElementById('sidenav');
  nav.innerHTML=SCREENS.map(s=>'<button data-s="'+s[0]+'" onclick="show(\''+s[0]+'\')">'+s[1]+'</button>').join('');
  refreshKill(); show('warroom');
}
if(TOKEN){fetch(API+'/api/v1/control/kill',{headers:{'Authorization':'Bearer '+TOKEN}}).then(r=>{if(r.ok){boot();}else showLogin();}).catch(()=>showLogin());}
else showLogin();
</script></body></html>
