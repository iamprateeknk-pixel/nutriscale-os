<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriScale OS — V12 Command Center</title>
<meta name="color-scheme" content="light dark">
<style>
/* ---------- Design tokens (V24) ---------- */
:root{
  --bg:#f6f4ef;--surface:#ffffff;--surface-2:#faf8f4;--line:#e7e1d6;--line-2:#d9d1c3;
  --ink:#1f2622;--ink-2:#4d5752;--ink-3:#7a837e;
  --brand:#2f6b4f;--brand-2:#3f8a66;--brand-ink:#ffffff;--brand-soft:#e5f0ea;
  --accent:#b8743a;--accent-soft:#f6ebdf;
  --ok:#1f7a4d;--ok-soft:#e3f3ea;--warn:#a36a00;--warn-soft:#fbf0d9;--bad:#b3261e;--bad-soft:#fbe5e3;--info:#2457a6;--info-soft:#e6eefb;
  --shadow:0 1px 2px rgba(31,38,34,.05),0 2px 8px rgba(31,38,34,.05);--shadow-lg:0 10px 40px rgba(31,38,34,.18);
  --r:14px;--r-sm:10px;--nav-w:248px;
  --font:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614;--surface:#1a201d;--surface-2:#1f2622;--line:#2b3430;--line-2:#38433e;
  --ink:#e8ece9;--ink-2:#b6c0ba;--ink-3:#86918b;
  --brand:#5fb88a;--brand-2:#79c9a0;--brand-ink:#0d1a13;--brand-soft:#1f3329;
  --accent:#e0a36a;--accent-soft:#3a2c1f;
  --ok:#6cc995;--ok-soft:#183126;--warn:#e6b450;--warn-soft:#3a2f17;--bad:#f2867c;--bad-soft:#3d1f1c;--info:#8fb4f2;--info-soft:#1b2840;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 10px 40px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#121614;--surface:#1a201d;--surface-2:#1f2622;--line:#2b3430;--line-2:#38433e;
  --ink:#e8ece9;--ink-2:#b6c0ba;--ink-3:#86918b;
  --brand:#5fb88a;--brand-2:#79c9a0;--brand-ink:#0d1a13;--brand-soft:#1f3329;
  --accent:#e0a36a;--accent-soft:#3a2c1f;
  --ok:#6cc995;--ok-soft:#183126;--warn:#e6b450;--warn-soft:#3a2f17;--bad:#f2867c;--bad-soft:#3d1f1c;--info:#8fb4f2;--info-soft:#1b2840;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 10px 40px rgba(0,0,0,.5);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 12px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--brand));display:grid;place-items:center;color:#fff;font-size:18px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand small{color:var(--ink-3);font-size:11.5px}
nav{padding:6px 10px 18px;flex:1}
.nav-group{margin-top:12px}
.nav-group>span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:var(--ink-2);padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button.active{background:var(--brand-soft);color:var(--brand);font-weight:650}
nav button .ic{width:20px;text-align:center;flex-shrink:0}
nav button .pill{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:10.5px;font-weight:700;padding:1px 7px}
.aside-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);height:36px;min-width:36px;padding:0 10px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--ink-3)}
#killBtn{border:1px solid var(--line);background:var(--ok-soft);color:var(--ok);height:36px;padding:0 12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:12.5px;white-space:nowrap}
#killBtn.on{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}}
#menuBtn{display:none}
main{padding:22px 24px 60px;max-width:1280px;width:100%}
.page-sub{color:var(--ink-3);margin:-4px 0 18px;font-size:13px}

/* ---------- Components ---------- */
.grid{display:grid;gap:14px}.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card{padding:14px 16px}
.card .k{font-size:12px;color:var(--ink-3)}.card .v{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.panel{padding:16px 18px;margin-bottom:16px}
.panel h3,h3{font-size:14.5px;margin:0 0 10px;letter-spacing:-.005em}
.panel>h3+p{margin-top:-6px}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.muted{color:var(--ink-3)}.small{font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}.b-mute{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.evidence{font-size:11.5px;color:var(--ink-3);margin-top:10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--surface-2)}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--ink-2);background:var(--surface)}
.empty .e-ic{font-size:26px;display:block;margin-bottom:6px}
.empty .btn{margin-top:12px}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);font-weight:600}
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--brand);border-color:var(--line-2)}
.btn.ghost{background:none;border-color:transparent;color:var(--brand);padding:6px 8px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
form.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;align-items:flex-end}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12.5px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:650}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.counter{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}.counter.over{color:var(--bad);font-weight:700}
.task{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:8px}
.task .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.p1 .dot{background:var(--bad)}.p2 .dot{background:var(--warn)}.p3 .dot{background:var(--info)}
.task .t{flex:1;min-width:0}.task .t small{display:block;color:var(--ink-3)}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border:0}.check .cb{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;font-size:12px;margin-top:1px}
.check.done .cb{background:var(--ok);border-color:var(--ok);color:#fff}.check.done b{color:var(--ink-3);text-decoration:line-through}
.ring{--p:0;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex-shrink:0}
.ring>div{width:68px;height:68px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:18px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.tag{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:0 4px 6px 0;font-size:12.5px}
.tag.neg{border-color:var(--bad-soft);background:var(--bad-soft);color:var(--bad)}
.issue{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.issue:last-child{border:0}
.out{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-word;white-space:pre-wrap}
.copy{float:right}
.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 14px}.tl:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.skeleton{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
details.rule{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;background:var(--surface)}
details.rule summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;list-style:none}
details.rule summary::-webkit-details-marker{display:none}
details.rule p{margin:8px 0 0;color:var(--ink-2)}

/* ---------- Overlays ---------- */
#login{position:fixed;inset:0;background:radial-gradient(1200px 600px at 20% 10%,var(--brand-soft),transparent),var(--bg);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#login .box{background:var(--surface);border:1px solid var(--line);padding:28px;border-radius:18px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
#login input{width:100%;margin:6px 0}
.err{color:var(--bad);font-size:12.5px;min-height:18px}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:40;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;animation:tin .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,12,.45);display:flex;align-items:center;justify-content:center;z-index:35;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:440px;box-shadow:var(--shadow-lg)}
.modal h3{font-size:16px}.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.modal input{width:100%}
#palette .modal{max-width:520px;padding:10px}
#palette input{border:0;box-shadow:none;font-size:15px;padding:12px}
#palette .res{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
#palette .res button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:14px}
#palette .res button.sel,#palette .res button:hover{background:var(--brand-soft)}
.scrim{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1024px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);z-index:20;transform:translateX(-102%);transition:transform .2s ease;box-shadow:var(--shadow-lg)}
  body.nav-open aside{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
  #menuBtn{display:inline-flex}
  .topbar{padding:10px 16px}main{padding:16px 16px 60px}
  .g2,.g3,.cols,.g-main{grid-template-columns:1fr}
  .task{flex-wrap:wrap}.task .t{flex-basis:calc(100% - 24px)}.task .btn{margin-left:auto}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="login"><div class="box">
  <div class="brand" style="padding:0 0 14px"><div class="logo">🌰</div><div><b>NutriScale OS</b><small>Dry Fruit Farm</small></div></div>
  <h2 style="font-size:18px">Wapas swagat hai</h2>
  <p class="muted small" style="margin-top:2px">Pehle pehchan, phir data — bina login ke kuch nahi dikhta.</p>
  <form onsubmit="doLogin();return false">
  <input id="lu" placeholder="Username" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <input id="lt" placeholder="MFA code (authenticator app se)" style="display:none" inputmode="numeric" autocomplete="one-time-code">
  <div class="err" id="lerr"></div><button class="btn" style="width:100%;justify-content:center">Login</button></form>
</div></div>

<div class="app">
  <aside id="aside">
    <div class="brand"><div class="logo">🌰</div><div><b>NutriScale OS</b><small>Dry Fruit Farm · Amazon + Flipkart</small></div></div>
    <nav id="sidenav"></nav>
    <div class="aside-foot"><span id="who">—</span> · <a href="#" onclick="logout();return false">Logout</a></div>
  </aside>
  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
  <div style="min-width:0">
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="pageTitle">Aaj</h1><div class="sp"></div>
      <button class="iconbtn hide-sm" onclick="openPalette()" aria-label="Screen dhoondho">🔎 Dhoondho <span class="kbd">Ctrl K</span></button>
      <button class="iconbtn" onclick="toggleTheme()" aria-label="Light/dark theme badlo" title="Light/dark" id="themeBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      <button id="killBtn" onclick="toggleKill()">Kill Switch: …</button>
    </div>
    <main id="main"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
const API=location.protocol.startsWith('http')?location.origin:'http://'+location.hostname+':8765';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let TOKEN=localStorage.getItem('ns_token')||'', USER=null, KILL=false, CURRENT='today', KNOW=null;
/* Screens: [key, label, icon, group] — purane 16 keys wahi hain (bookmarks/tests), V24 me naye jude */
const SCREENS=[
 ['today','Aaj ka kaam','🏠','Aaj'],['approvals','Approval Inbox','✅','Aaj'],['warroom','War Room','📊','Aaj'],
 ['listingbuilder','Listing Builder','✨','Badhao'],['keywordplan','Keyword Plan','🧭','Badhao'],['sqp','SQP Funnel','🔬','Badhao'],
 ['keywords','Keyword Lab','🔑','Badhao'],['ads','Ads Studio','🎯','Badhao'],['rank','Rank Tracker','📈','Badhao'],
 ['listings','Listing Versions','📝','Badhao'],['creative','Creative Lab','🎨','Badhao'],['competitors','Competitors','🔭','Badhao'],
 ['compare','Peer Compare','⚖️','Badhao'],['experiments','Experiments','🧪','Badhao'],
 ['growth','Growth Playbook','🚀','Paisa'],['profit','Profit & Settlements','💰','Paisa'],['products','Product Intelligence','📦','Paisa'],['inventory','Inventory & Festival','🏭','Paisa'],
 ['brain','Agent Brain','🧠','Dimaag'],['knowledge','Knowledge Base','📚','Dimaag'],
 ['integrations','Integrations & Data','🔌','System'],['agency','Agency Board','🤝','System'],['ops','System Ops','🛠️','System']];
const SUB={today:'Sabse zaroori kaam pehle — har kaam ka saboot aur niyam saath me',approvals:'Agents ke proposals — bina tumhari haan ke kuch live nahi jaata',warroom:'Bikri, ads aur TACOS ek nazar me',
 listingbuilder:'Amazon 2026 niyam ke andar title, Item Highlights aur backend — poori jaanch ke saath',keywordplan:'Kaunsa keyword kahan: title, highlights, backend ya negative',sqp:'Brand Analytics: har query par tumhara market share kis seedhi par girta hai',
 keywords:'Apne Ads search terms ka opportunity matrix',ads:'Kharch, harvest aur negatives',rank:'Keyword rank ka itihaas aur parakh',listings:'Har listing ka version — itihaas kabhi nahi mitta',creative:'7-shot image brief',
 competitors:'Verified peers aur unke dated snapshots',compare:'Apna SKU banam peer — decision packet',experiments:'Tajurbe aur unka imaandaar verdict',
 growth:'Research ke niyam tumhare data par: break-even ACOS, campaign structure, sale calendar, reviews',profit:'Settlement se mila hisaab hi sach',products:'Action plan, cost aur SKU 360°',inventory:'Stock gate aur festival combos',
 brain:'Agents kya seekh rahe hain — bharosa sirf VERIFIED nateejo se badalta hai',knowledge:'Har niyam ka source, status aur bharosa — research 11 Nov 2026',
 integrations:'Connectors, capabilities aur CSV import',agency:'Agency ka kaam — saboot par score',ops:'Jobs aur system ki sehat'};
const NUTS=[['almond','Badam'],['cashew','Kaju'],['pistachio','Pista'],['walnut','Akhrot'],['raisin','Kishmish'],['fig','Anjeer'],['dates','Khajoor'],['apricot','Khubani']];

/* ---------- Basics ---------- */
async function api(path,method,body){
  const r=await fetch(API+path,{method:method||'GET',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(r.status===401){showLogin();throw new Error('login chahiye');}
  if(r.status===403){throw new Error('is kaam ki ijaazat tumhare role me nahi');}

async function loadPacket(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/competitors/packet?sku='+encodeURIComponent(f.sku)+'&peer='+f.peer+'&nut='+encodeURIComponent(f.nut)+'&grade='+encodeURIComponent(f.grade)+'&pack_g='+f.pack_g);document.getElementById('packet').innerHTML='<div class="panel"><p><b>Match:</b> '+esc(d.match?d.match.class:'—')+'</p><p><b>Farq:</b> apna '+esc(d.gap?d.gap.own_per_100g:'—')+'/100g vs peer '+esc(d.gap?d.gap.peer_per_100g:'—')+'/100g ('+esc(d.gap?d.gap.gap_pct:'—')+'%)</p><p><b>Playbook:</b> '+esc(d.playbook||'')+'</p><p><b>Sifarish:</b> '+esc(d.recommended_action||d.note||'')+'</p><p class="evidence">'+esc(d.do_not_claim||'')+'</p></div>';return false;}
function sparkSVG(vals,invert){
  if(!vals||vals.length<2)return '';
  const w=560,h=90,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>((i/(vals.length-1))*w).toFixed(1)+','+(invert?((v-mn)/rg*(h-16)+8):(h-8-(v-mn)/rg*(h-16))).toFixed(1)).join(' ');
  return '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:8px" role="img" aria-label="rank trend"><polyline points="'+pts+'" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/></svg>';
}
async function loadRank(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/rank?term='+encodeURIComponent(f.term)+'&sku='+encodeURIComponent(f.sku));const dg=await api('/api/v1/rank/diagnostic?term='+encodeURIComponent(f.term)+'&sku='+encodeURIComponent(f.sku));let g='';if(d.history&&d.history.length>1)g=sparkSVG(d.history.map(x=>x.position),true);
  let hy='';if(dg.hypotheses&&dg.hypotheses.length)hy='<h3 style="margin-top:14px">Rank parakh (parikalpana — siddh kaaran nahi)</h3>'+dg.hypotheses.map(x=>'<div class="issue">'+badge('HYPOTHESIS','warn')+'<div><b>'+esc(x.hypothesis)+'</b><div class="small muted">Saboot: '+esc(x.evidence)+' · Kaam: '+esc(x.action)+'</div></div></div>').join('');
  document.getElementById('rankout').innerHTML='<div class="panel"><b>'+esc(d.term)+'</b> — points: '+esc(d.points)+' · '+(d.status==='OK'?('taaza position '+esc(d.latest)+', badlav '+esc(d.delta)):esc(d.note))+g+hy+'</div>';return false;}
async function addDraft(e){e.preventDefault();const f=new FormData(e.target);try{await api('/api/v1/listings/draft','POST',{sku:f.get('sku'),title:f.get('title'),bullets:[]});toast('Draft bana','ok');}catch(err){toast(err.message,'bad');}show('listings');return false;}
async function loadBrief(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/creative/brief?product='+encodeURIComponent(f.product)+'&grade='+encodeURIComponent(f.grade||'')+'&weight='+encodeURIComponent(f.weight||''));document.getElementById('brief').innerHTML=table([{t:'#',k:'shot'},{t:'Prakar',k:'type'},{t:'Brief',k:'brief'}],d.shots);return false;}
async function addCost(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('/api/v1/costs','POST',{sku:f.sku,cogs:Number(f.cogs),packaging:Number(f.packaging||0)});toast('Cost darj — ab break-even ACOS nikal sakte ho','ok');}catch(err){toast(err.message,'bad');}show('profit');return false;}
async function loadGate(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/inventory/gate?sku='+encodeURIComponent(f.sku));document.getElementById('gate').innerHTML='<p><b>'+esc(d.sku)+'</b> — stock: '+esc(d.qty)+' · '+badge(d.status,d.status==='OK'?'ok':d.status==='LOW'?'warn':'bad')+' '+esc(d.note||'')+'</p>';return false;}
async function pubListing(id,live){if(live){const ok=await ask('LIVE publish?','Amazon par asal badlav jayega — sirf certified capability par chalega.',{noInput:true,ok:'Haan, live karo',danger:true});if(!ok)return;}
  try{const r=await api('/api/v1/listings/publish','POST',{id:id,product_type:'FOOD',live:live});r.ok?toast('Mode: '+r.mode+' · vendor: '+(r.vendor_status||'')+(r.issues&&r.issues.length?' · '+r.issues.length+' issues':''),'ok'):toast('Nahi hua: '+(r.error||''),'bad');}catch(e){toast(e.message,'bad');}show('listings');}
async function load360(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const d=await api('/api/v1/products/'+encodeURIComponent(f.sku)+'/360');const el=document.getElementById('p360');
  if(!d.found){el.innerHTML=emptyState(esc(d.error||'SKU nahi mila'));return false;}
  const fin=d.finance||{};
  el.innerHTML=cards([['Product',esc(d.name),esc(d.platform)+' · '+inr(d.price)+' · ⭐ '+esc(d.rating??'—')+' ('+esc(d.reviews??0)+')'],['Bikri',inr(d.sales.revenue||0),(d.sales.units||0)+' units'],['Munafa',fin.known?inr(fin.contribution):'—',fin.known?('margin '+fin.margin_pct+'% · '+esc(fin.fee_precision||'')):'cost nahi'],['Stock',esc(d.inventory.total_qty),'cover: '+(d.inventory.days_of_cover==null?'bikri data nahi':Math.round(d.inventory.days_of_cover)+' din')]])+
  '<p class="small muted">Listing versions: '+(d.listing_versions.length?d.listing_versions.map(v=>'v'+v.version+' ('+esc(v.status)+')').join(', '):'koi nahi')+'</p>';return false;}
async function viewProp(id){try{const d=await api('/api/v1/actions/'+id);const a=d.action;let p={};try{p=JSON.parse(a.payload||'{}');}catch(e){}
  const m=modal('<h3>#'+a.id+' · '+esc(a.kind)+'</h3><p class="small muted">'+esc(a.platform)+' · '+esc(a.state)+' · '+esc(a.created_by)+'</p>'+(p.title?'<p><b>Title:</b> '+esc(p.title)+'</p>':'')+(p.rule_ids?'<p>'+p.rule_ids.map(ruleChip).join(' ')+'</p>':'')+'<div class="out" style="max-height:240px;overflow:auto">'+esc(JSON.stringify(p,null,2))+'</div><p class="small muted">'+esc(a.predicted||'')+'</p><div class="acts"><button class="btn sec">Band karo</button></div>');m.querySelector('.acts button').onclick=()=>m.remove();}catch(e){toast(e.message,'bad');}}
async function propAct(id,op){try{const r=await api('/api/v1/proposals/'+id+'/'+op,'POST',{});toast(r.state?(op==='approve'&&r.needed?'Pushti darj — '+(r.approvals||1)+'/'+r.needed:'State: '+r.state):(r.error||'ho gaya'),r.error?'bad':'ok');}catch(e){toast('Nahi ho paya: '+e.message,'bad');}show('approvals');}
async function propExec(id){const ref=await ask('Execute ka saboot','Vendor console me badlav karke uska ref/saboot do — bina saboot ke APPLIED nahi likha jayega.',{placeholder:'jaise: campaign change id / screenshot ref',ok:'Darj karo'});if(!ref)return;try{const r=await api('/api/v1/proposals/'+id+'/execute','POST',{manual_ref:ref});r.state==='APPLIED_VERIFIED'?toast('✔ APPLIED_VERIFIED','ok'):toast('Nahi hua: '+(r.error||r.state),'bad');}catch(e){toast(e.message,'bad');}show('approvals');}
async function legacyAct(id,op){try{await api('/api/approvals/'+id+'/'+op,'POST',{});toast(op==='approve'?'Approve ho gaya':'Reject ho gaya','ok');}catch(e){toast(e.message,'bad');}show('approvals');}
let WIZPATH='';
async function wizPreview(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));WIZPATH=f.path;try{const d=await api('/api/v1/imports/preview','POST',{path:f.path});document.getElementById('wiz').innerHTML='<p>Prakar: <b>'+esc(d.kind)+'</b> · Rows: '+esc(d.rows)+' · '+(d.duplicate?badge('DUPLICATE — commit rukega','warn'):badge('naya','ok'))+'<br><span class="small muted">'+esc(d.note)+'</span></p>';}catch(err){toast(err.message,'bad');}return false;}
async function wizCommit(e){e.preventDefault();if(!WIZPATH){toast('Pehle preview karo','bad');return false;}try{const d=await api('/api/v1/imports/commit','POST',{path:WIZPATH});d.duplicate?toast('Duplicate — import nahi hua','bad'):toast('Import ho gaya: '+(d.imported??0)+' rows','ok');}catch(err){toast(err.message,'bad');}return false;}

/* ---------- Navigation ---------- */
async function show(name){if(!VIEWS[name])name='today';CURRENT=name;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===name));
  const sc=SCREENS.find(s=>s[0]===name);document.getElementById('pageTitle').textContent=sc?sc[1]:'';
  document.title=(sc?sc[1]+' · ':'')+'NutriScale OS';
  document.body.classList.remove('nav-open');
  if(location.hash!=='#'+name)history.replaceState(null,'','#'+name);
  const m=document.getElementById('main');m.innerHTML='<p class="page-sub">'+esc(SUB[name]||'')+'</p><div id="view"><div class="skeleton"></div><div class="skeleton" style="width:72%"></div><div class="skeleton" style="width:48%"></div></div>';
  const v=document.getElementById('view');Object.assign(v.dataset,m.dataset);
  try{await VIEWS[name](v);}catch(e){const vv=document.getElementById('view');if(vv)vv.innerHTML=emptyState('Data laane me dikkat: '+esc(e.message)+'<br><span class="small muted">Backend chal raha hai na?</span>',[name,'Dobara koshish']);}
}
function buildNav(pending){
  const groups=[...new Set(SCREENS.map(s=>s[3]))];
  document.getElementById('sidenav').innerHTML=groups.map(g=>'<div class="nav-group"><span>'+g+'</span>'+SCREENS.filter(s=>s[3]===g).map(s=>'<button data-s="'+s[0]+'" onclick="show(\''+s[0]+'\')"><span class="ic">'+s[2]+'</span>'+s[1]+(s[0]==='approvals'&&pending?'<span class="pill">'+pending+'</span>':'')+'</button>').join('')+'</div>').join('');
}
function openPalette(){
  const m=modal('<input id="palIn" placeholder="Screen ka naam likho… (jaise listing, ads, brain)" autocomplete="off"><div class="res" id="palRes"></div>');m.id='palette';
  const inp=m.querySelector('#palIn'),res=m.querySelector('#palRes');let sel=0,list=[];
  const draw=()=>{const q=inp.value.toLowerCase();list=SCREENS.filter(s=>(s[1]+' '+s[0]+' '+s[3]).toLowerCase().includes(q));sel=Math.min(sel,Math.max(0,list.length-1));
    res.innerHTML=list.map((s,i)=>'<button class="'+(i===sel?'sel':'')+'" data-k="'+s[0]+'"><span>'+s[2]+'</span>'+s[1]+'<span class="muted small" style="margin-left:auto">'+s[3]+'</span></button>').join('')||'<p class="muted small" style="padding:10px">Kuch nahi mila</p>';
    res.querySelectorAll('button').forEach(b=>b.onclick=()=>{m.remove();show(b.dataset.k);});};
  inp.addEventListener('input',()=>{sel=0;draw();});
  inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault();}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault();}else if(e.key==='Enter'&&list[sel]){m.remove();show(list[sel][0]);}else if(e.key==='Escape')m.remove();});
  draw();inp.focus();
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.getElementById('palette'))openPalette();}
  if(e.key==='Escape'){document.querySelectorAll('.modal-bg').forEach(x=>x.remove());document.body.classList.remove('nav-open');}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==CURRENT&&VIEWS[h])show(h);});
async function boot(){
  document.getElementById('who').textContent=localStorage.getItem('ns_user')||'Owner';
  buildNav(0); refreshKill();
  const h=location.hash.slice(1);show(VIEWS[h]?h:'today');
  try{const t=await api('/api/v1/today');buildNav(t.pending_approvals);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.s===CURRENT));}catch(e){}
}
if(TOKEN){fetch(API+'/api/v1/control/kill',{headers:{'Authorization':'Bearer '+TOKEN}}).then(r=>{if(r.ok){boot();}else showLogin();}).catch(()=>showLogin());}
else showLogin();
</script></body></html>
