name: NutriScale OS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Saare test suites chalao
        run: |
          fail=0
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t" || fail=1
          done
          exit $fail
