# NutriScale OS — production HTTPS (Caddy fetches a Let's Encrypt certificate automatically)
# Run:  DOMAIN=app.your-domain.in docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requirements: the domain's DNS points to this server, ports 80/443 are open.
services:
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      - nutriscale
volumes:
  caddy-data:
  caddy-config:
