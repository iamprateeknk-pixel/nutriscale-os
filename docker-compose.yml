# NutriScale OS — backend + worker (24x7 scheduler):  docker compose up -d
services:
  nutriscale:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - nutriscale-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
  worker:
    build: .
    command: python3 src/jobrunner.py --daemon
    volumes:
      - nutriscale-data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - nutriscale
volumes:
  nutriscale-data:
